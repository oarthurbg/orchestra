<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orchestra liveview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M10 90 A 27 27 0 0 1 64 90 Z' fill='%23B9C8F2'/%3E%3Ccircle cx='34' cy='34' r='24' fill='%232450E0'/%3E%3Crect x='62' y='10' width='28' height='42' fill='%23F0442C'/%3E%3Cpolygon points='66,90 90,90 78,56' fill='%23FFC21A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Style: achromatic-ledger, mapped onto docs/BRAND.md and the tokens of docs/index.html.
   The chrome is paper and ink; cobalt (--data) is the one data hue; the Bauhaus shapes are the only other colour.
   Grid: fluid canvas, 32px gutter; the KPI strip is 4 equal cells; the middle row is 2fr + 1fr with one 16px gap. */
:root{
  --ground:#FAF8F3; --surface:#FFFFFF; --raised:#F0ECE3; --border:#E4DED2; --rule:#EFEBE3; --grid:#ECE7DD; --pause:#EDE7DC;
  --text:#111114; --muted:#5E5A52; --primary:#111114; --on-primary:#FAF8F3;
  --data:#2450E0; --data-pale:#B9C8F2; --data-tint:#C9D4F7; --negative:#C8341B;
  --circle:#2450E0; --square:#F0442C; --triangle:#FFC21A; --half:#B9C8F2; --idle:#8FA3D9;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --radius:4px; --gap:16px; --pad:20px; --gutter:32px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#000000; --surface:#0E0E10; --raised:#18181B; --border:#232327; --rule:#1A1A1D; --grid:#202024; --pause:#19191D;
  --text:#F1EEE8; --muted:#A9A49A; --primary:#F1EEE8; --on-primary:#000000;
  --data:#5B7FFF; --data-pale:#4A62B8; --data-tint:#2A3460; --negative:#FF6A52; --half:#B9C8F2; --idle:#B9C8F2; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#000000; --surface:#0E0E10; --raised:#18181B; --border:#232327; --rule:#1A1A1D; --grid:#202024; --pause:#19191D;
  --text:#F1EEE8; --muted:#A9A49A; --primary:#F1EEE8; --on-primary:#000000;
  --data:#5B7FFF; --data-pale:#4A62B8; --data-tint:#2A3460; --negative:#FF6A52; --half:#B9C8F2; --idle:#B9C8F2; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:14px/20px var(--body);font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:2px solid var(--data);outline-offset:2px}
.bar-top{height:48px;display:flex;align-items:center;gap:12px;padding:0 var(--gutter);border-bottom:1px solid var(--border)}
.word{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.scope{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fresh{margin-left:auto;color:var(--muted);font-size:12px}
.themes{display:flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:999px}
.themes button{font:500 12px var(--body);color:var(--muted);background:none;border:0;border-radius:999px;padding:4px 10px;cursor:pointer}
.themes button:hover{color:var(--text)}
.themes button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
main{padding:28px var(--gutter) 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap)}
.title{display:flex;align-items:flex-start;gap:16px;margin-bottom:8px}
#action{margin-left:auto;flex:none}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:36px;letter-spacing:-.02em;margin:0}
.finding{margin:4px 0 0;color:var(--muted);font-size:16px;line-height:24px;max-width:80ch}
.finding b{color:var(--text);font-weight:600}
.btn{flex:none;height:34px;padding:0 14px;border-radius:var(--radius);background:var(--primary);color:var(--on-primary);border:0;font:500 14px var(--body);display:inline-flex;align-items:center;text-decoration:none;cursor:pointer}
.btn:hover{opacity:.88}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.card-head{display:flex;align-items:baseline;gap:12px;padding:16px var(--pad) 0}
h2{font-family:var(--display);font-weight:800;font-size:17px;line-height:24px;letter-spacing:-.01em;margin:0}
.meta{color:var(--muted);font-size:13px}
.card-head .meta{margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{padding:16px var(--pad);border-left:1px solid var(--border)}
.kpi:first-child{border-left:0}
.kpi .label{color:var(--muted)}
.kpi .value{font-family:var(--display);font-weight:800;font-size:30px;line-height:38px;letter-spacing:-.02em;margin-top:4px}
.kpi .sub{color:var(--muted);margin-top:2px}
.kpi .bad{color:var(--negative)}
.middle{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:var(--gap)}
#chart{display:block;width:100%;height:220px;padding:8px var(--pad) 16px}
.needs{list-style:none;margin:8px 0 0;padding:0 0 8px}
.needs li{border-top:1px solid var(--rule)}
.needs li:first-child{border-top:0}
.needs .item{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px var(--pad);color:inherit;text-decoration:none}
/* A row with a link is one link: the whole row highlights and opens the session. */
.needs a.item:hover{background:var(--raised)}
.needs a.item:hover .open{text-decoration:underline}
.needs a.item:focus-visible{outline-offset:-2px}
.needs .why{grid-column:2 / 4;color:var(--muted)}
.needs .open{font-weight:500}
.needs li.empty{padding:8px var(--pad);color:var(--muted)}
.score{overflow-x:auto;padding:8px 0 4px}
.score-inner{min-width:1040px}
.row{display:grid;grid-template-columns:20px 200px 64px 72px 96px 120px minmax(300px,1fr);gap:24px;align-items:center;min-height:44px;padding:0 var(--pad);border-top:1px solid var(--rule)}
.row.head{min-height:32px;border-top:0;color:var(--muted);font-size:12px}
.row.click{cursor:pointer}
.name a{text-decoration:none;font-weight:500}
.name a:hover{text-decoration:underline}
.disclose{text-align:left;font:700 14px var(--display);letter-spacing:-.01em;color:inherit;background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.row.click:hover{background:var(--raised)}
.row.open{background:var(--raised)}
.name{display:flex;gap:6px;min-width:0;align-items:baseline}
.name > :first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why2{color:var(--muted);white-space:nowrap}
.big{color:var(--negative)}
.track{position:relative;height:20px}
.now{position:absolute;top:-12px;bottom:-12px;width:1px;background:var(--text)}
.days{position:relative;height:20px}
.days span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.days .day{color:var(--text);font-weight:500}
.days .nowlabel{top:-16px;color:var(--text);font-weight:500}
.row.head{padding-top:12px}
.tasks{background:var(--raised);padding:4px var(--pad) 12px calc(var(--pad) + 32px);border-top:1px solid var(--rule)}
.task{display:grid;grid-template-columns:16px minmax(0,320px) 220px 90px;gap:8px;min-height:28px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:12px var(--pad) 16px;color:var(--muted);font-size:13px;border-top:1px solid var(--rule)}
.wait-sw{background:var(--pause);border:1px solid var(--border)}
.sw{display:inline-block;width:18px;height:10px;border-radius:5px;vertical-align:-1px;margin-right:6px}
.error{color:var(--negative)}
#cal{padding:12px var(--pad) 16px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--border);border-left:1px solid var(--border)}
.month .dow{padding:6px 10px;color:var(--muted);font-size:12px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.cell{position:relative;min-height:112px;padding:8px 10px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.cell.past{color:var(--muted)}
.cell .num{font:800 18px/24px var(--display);letter-spacing:-.02em}
.cell.today .num{display:inline-block;align-self:flex-start;padding:0 8px;border-radius:999px;background:var(--primary);color:var(--on-primary)}
.cell.blocked{background:var(--pause)}
.drop{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:13px}
.drop b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .note{margin-top:auto;color:var(--muted);font-size:13px}
.pill{position:absolute;top:5px;height:10px;border-radius:5px}
.wait{position:absolute;top:-12px;bottom:-12px;background:var(--pause)}

@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0;border-top:1px solid var(--border);grid-column:1 / -1}
  .middle{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  :root{--gutter:16px;--pad:16px}
  .scope{display:none}
  .fresh{display:none}
  /* The freshness line is hidden here, except when it holds an error: that wraps under the bar. */
  .bar-top:has(.fresh .error){height:auto;min-height:48px;flex-wrap:wrap;padding-bottom:8px}
  .fresh:has(.error){display:block;order:9;flex-basis:100%;margin-left:0}
  .themes{margin-left:auto}
  .title{flex-wrap:wrap}
  #action{margin-left:0}
  /* The score folds into two-line rows: name and ETA, then context and stage, then the track. */
  .score-inner{min-width:0}
  .row{grid-template-columns:20px auto auto minmax(0,1fr) auto;grid-template-areas:"s n n n e" ". c g p p" "t t t t t";gap:4px 12px;padding-top:10px;padding-bottom:10px}
  .row > :nth-child(1){grid-area:s}.row > :nth-child(2){grid-area:n}.row > :nth-child(3){grid-area:c}
  .row > :nth-child(4){grid-area:g}.row > :nth-child(5){grid-area:p}.row > :nth-child(6){grid-area:e}.row > :nth-child(7){grid-area:t}
  .task{grid-template-columns:16px minmax(0,1fr) auto}
  .task .meta{grid-column:2 / 4;grid-row:2}
  .tasks{padding-left:var(--pad)}
  .days span:nth-child(even){display:none}
  .now, .track .wait{top:0;bottom:0}
  .month{grid-template-columns:minmax(0,1fr);border-left:0;border-top:0}
  .month .dow, .cell.empty{display:none}
  .cell{min-height:0;border-right:0;border-bottom:1px solid var(--rule)}
}
</style>
</head>
<body>
<header class="bar-top">
  <svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><path d="M10 90 A 27 27 0 0 1 64 90 Z" fill="var(--half)"/><circle cx="34" cy="34" r="24" fill="#2450E0"/><rect x="62" y="10" width="28" height="42" fill="#F0442C"/><polygon points="66,90 90,90 78,56" fill="#FFC21A"/></svg>
  <span class="word">orchestra</span>
  <span class="scope">liveview</span>
  <span class="fresh" id="fresh"></span>
  <p id="status" class="sr-only" role="status"></p>
  <div class="themes" role="group" aria-label="Theme">
    <button type="button" data-theme-pick="system" aria-pressed="false">System</button>
    <button type="button" data-theme-pick="light" aria-pressed="false">Light</button>
    <button type="button" data-theme-pick="dark" aria-pressed="false">Dark</button>
  </div>
</header>
<main>
  <div class="title">
    <div><h1 id="project">Liveview</h1><p class="finding" id="finding">Reading the project…</p></div>
    <span id="action"></span>
  </div>
  <section class="card kpis" id="kpis" aria-label="When work lands, and the plan limits"></section>
  <div class="middle">
    <section class="card" aria-labelledby="h-needs">
      <div class="card-head"><h2 id="h-needs">Needs you</h2><span class="meta" id="needs-meta"></span></div>
      <ul class="needs" id="needs"></ul>
    </section>
    <section class="card" aria-labelledby="h-week">
      <div class="card-head"><h2 id="h-week">Weekly limit</h2><span class="meta" id="week-meta"></span></div>
      <svg id="chart" role="img" aria-label="Weekly limit used, actual and projected"></svg>
    </section>
  </div>
  <section class="card" aria-labelledby="h-work">
    <div class="card-head"><h2 id="h-work">Workstreams</h2><span class="meta" id="work-meta"></span></div>
    <div class="score"><div class="score-inner" id="grid"></div></div>
    <div class="legend" id="legend"></div>
  </section>
  <section class="card" aria-labelledby="h-cal">
    <div class="card-head"><h2 id="h-cal">Delivery calendar</h2><span class="meta" id="cal-meta"></span></div>
    <div id="cal"></div>
  </section>
</main>
<script>
const $ = (tag, attrs = {}, ...kids) => {
  const el = tag.startsWith('svg:') ? document.createElementNS('http://www.w3.org/2000/svg', tag.slice(4)) : document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.setAttribute('class', v)
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v)
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : String(kid))
  return el
}
// One persistent live region, written only when a state changes, so a screen reader hears failures and recovery, never the 5 s refresh.
const say = t => { const s = document.getElementById('status'); if (s.textContent !== t) s.textContent = t }
let failed = false
const fail = t => { failed = true; say(t) }
const MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR
const dur = m => (m == null ? '–' : m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? ` ${String(m % 60).padStart(2, '0')} m` : ''}` : `${m} m`) // taste-skill-ignore: zero-padded minutes in a duration, not index numbering
const ktok = n => (n == null ? '–' : `${Math.round(n / 1000)}k`)
const when = t => new Date(t).toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' })
const clock = t => new Date(t).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })

// Theme: System follows the OS; Light and Dark set data-theme on <html>, which the tokens already honour.
let theme = 'system'
try { theme = localStorage.getItem('liveview-theme') || 'system' } catch { /* private window */ }
function applyTheme(next) {
  theme = next
  if (theme === 'system') document.documentElement.removeAttribute('data-theme')
  else document.documentElement.setAttribute('data-theme', theme)
  for (const b of document.querySelectorAll('[data-theme-pick]')) b.setAttribute('aria-pressed', String(b.dataset.themePick === theme))
  try { localStorage.setItem('liveview-theme', theme) } catch { /* private window */ }
  if (last) render(last)
}
for (const b of document.querySelectorAll('[data-theme-pick]')) b.addEventListener('click', () => applyTheme(b.dataset.themePick))
let open = new Set()
try { open = new Set(JSON.parse(localStorage.getItem('liveview-open') || '[]')) } catch { /* private window */ }
const saveOpen = () => { try { localStorage.setItem('liveview-open', JSON.stringify([...open])) } catch { /* private window */ } }

// The band's shapes: triangle waiting, square 250k or more, circle running, half circle idle or stale.
const SHAPES = {
  circle: () => $('svg:circle', { cx: 7, cy: 7, r: 6, fill: 'var(--circle)' }),
  triangle: () => $('svg:polygon', { points: '0,13 14,13 7,1', fill: 'var(--triangle)' }),
  square: () => $('svg:rect', { x: 1, y: 1, width: 12, height: 12, fill: 'var(--square)' }),
  half: () => $('svg:path', { d: 'M0 13 A 7 7 0 0 1 14 13 Z', fill: 'var(--idle)' }),
  'half-open': () => $('svg:path', { d: 'M1 12.5 A 6 6 0 0 1 13 12.5 Z', fill: 'none', stroke: 'var(--muted)', 'stroke-width': 1.5 }),
}
const shape = (s, label) => $('svg:svg', { width: 16, height: 16, viewBox: '0 0 14 14', role: 'img', 'aria-label': label }, SHAPES[s]())
const NEEDS = new Set(['waiting', 'over 250k', 'stale', 'unregistered', 'no session'])
const waitLabel = p => `Waiting for the ${p.kind === 'five_hour' ? '5-hour' : 'weekly'} limit to reset, ${when(p.from)} to ${when(p.to)}`
const waitMs = (snap, a, b) => snap.pauses.reduce((s, p) => s + Math.max(0, Math.min(b, p.to) - Math.max(a, p.from)), 0)
const lastEnd = snap => { const ends = [...snap.rows.filter(r => r.end != null).map(r => r.end), ...snap.queued.map(q => q.end)]; return ends.length ? Math.max(...ends) : null }

function title(snap) {
  document.getElementById('project').textContent = snap.project
  const age = Math.max(0, Math.round((Date.now() - snap.builtAt) / 1000))
  document.getElementById('fresh').replaceChildren($('span', {},
    snap.staleSince ? $('span', { class: 'error' }, `Stale since ${clock(snap.staleSince)} · `) : null, `Updated ${age} s ago`))
  const waiting = snap.rows.filter(r => r.reason === 'waiting')
  const last = lastEnd(snap)
  const parts = []
  if (waiting.length) parts.push($('b', {}, `${waiting[0].name} is waiting on you`), waiting[0].detail ? `: ${waiting[0].detail.replace(/^asks: /, '')}.` : '.', ' ')
  parts.push(last ? `All work lands by ${when(last)}.` : 'No plan is open.')
  document.getElementById('finding').replaceChildren(...parts)
  const target = waiting.find(r => r.link)
  document.getElementById('action').replaceChildren(target ? $('a', { class: 'btn', href: target.link, 'data-focus': 'action' }, `Open ${target.name}`) : '')
}

function kpis(snap) {
  const { fiveHour, week } = snap.limits
  const pct = p => (p.percent == null ? '–' : `${Math.round(p.percent)}%`)
  const last = lastEnd(snap)
  const cell = (label, value, sub, bad) => $('div', { class: 'kpi' }, $('div', { class: 'label' }, label), $('div', { class: 'value' }, value), $('div', { class: `sub${bad ? ' bad' : ''}` }, sub))
  document.getElementById('kpis').replaceChildren(
    cell('All merged by', last ? when(last) : '–', [snap.etaBasis >= 3 ? `From ${snap.etaBasis} finished tasks` : 'Uncalibrated: under 3 finished tasks',
      snap.pauses.length ? `${dur(Math.round(waitMs(snap, snap.builtAt, Infinity) / MIN))} of limit waits` : 'no limit waits'].join(', '), false),
    cell('5-hour limit', pct(fiveHour), fiveHour.percent == null ? 'No reading yet' : fiveHour.runOut ? `Runs out ${clock(fiveHour.runOut)}, before the reset` : `Resets ${clock(Date.parse(fiveHour.resetsAt))}`, !!fiveHour.runOut),
    cell('Weekly limit', pct(week), week.percent == null ? 'No reading yet' : week.runOut ? `Runs out ${when(week.runOut)}, before the reset` : `About ${Math.round(week.atReset ?? week.percent)}% at the reset, ${when(Date.parse(week.resetsAt))}`, !!week.runOut || (week.atReset ?? week.percent) >= 90),
  )
}

function chart(snap) {
  const svg = document.getElementById('chart')
  const W = svg.clientWidth || 800, H = 220, L = 40, R = 16, T = 24, B = 28
  const p = snap.limits.week
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`)
  document.getElementById('week-meta').textContent = p.resetsAt ? `Resets ${when(Date.parse(p.resetsAt))}` : ''
  if (!p.resetsAt) {
    svg.replaceChildren($('svg:line', { x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: 'var(--border)' }),
      $('svg:text', { x: L, y: H / 2, fill: 'var(--muted)', 'font-size': 14 }, 'No reading yet. It arrives with the first response in a session that runs the band.'))
    return
  }
  const end = Date.parse(p.resetsAt), start = end - 7 * DAY
  const x = t => L + ((t - start) / (end - start)) * (W - L - R)
  const y = v => T + (1 - v / 100) * (H - T - B)
  const kids = []
  for (const v of [0, 25, 50, 75, 100]) {
    kids.push($('svg:line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: v === 0 ? 'var(--border)' : 'var(--grid)' }))
    kids.push($('svg:text', { x: L - 8, y: y(v) + 4, 'text-anchor': 'end', fill: 'var(--muted)', 'font-size': 12 }, `${v}%`))
  }
  for (let d = new Date(start); +d < end; d.setDate(d.getDate() + 1)) {
    if (+d === start) continue
    kids.push($('svg:text', { x: x(+d), y: H - 8, 'text-anchor': 'middle', fill: 'var(--muted)', 'font-size': 12 }, d.toLocaleDateString(undefined, { weekday: 'short' })))
  }
  if (p.series.length) kids.push($('svg:polyline', { points: p.series.map(s => `${x(s.at)},${y(Math.min(s.percent, 100))}`).join(' '), fill: 'none', stroke: 'var(--data)', 'stroke-width': 2 }))
  const nowX = x(snap.builtAt)
  if (p.percent != null) {
    const [tx, ty, label] = p.runOut ? [x(p.runOut), y(100), `100% ${when(p.runOut)}`] : [x(end), y(Math.min(p.atReset ?? p.percent, 100)), `${Math.round(p.atReset ?? p.percent)}% at reset`]
    kids.push($('svg:polyline', { points: `${nowX},${y(p.percent)} ${tx},${ty}`, fill: 'none', stroke: 'var(--data)', 'stroke-width': 2, 'stroke-dasharray': '6 4' }))
    const close = p.runOut || (p.atReset ?? 0) >= 90
    const near = tx - nowX < 160
    kids.push($('svg:text', { ...(near ? { x: tx + 8, y: ty + 4, 'text-anchor': 'start' } : { x: Math.min(tx, W - R), y: ty - 8, 'text-anchor': 'end' }),
      fill: close ? 'var(--negative)' : 'var(--text)', 'font-size': 12 }, label))
    kids.push($('svg:text', { x: nowX - 6, y: T - 10, 'text-anchor': 'end', fill: 'var(--text)', 'font-size': 12 }, `Now ${Math.round(p.percent)}%`))
  }
  kids.push($('svg:line', { x1: nowX, x2: nowX, y1: T - 8, y2: H - B, stroke: 'var(--text)' }))
  if (p.reading) kids.push($('svg:circle', { cx: x(p.reading.at), cy: y(p.reading.percent), r: 3, fill: 'var(--text)' }))
  svg.replaceChildren(...kids)
}

function needs(snap) {
  const rows = snap.rows.filter(r => NEEDS.has(r.reason))
  document.getElementById('needs-meta').textContent = rows.length ? String(rows.length) : ''
  const list = document.getElementById('needs')
  if (!rows.length) { list.replaceChildren($('li', { class: 'empty' }, 'Nothing waits on you. Sessions over 250k, stale or unregistered show here too.')); return }
  const reason = r => (r.reason === 'waiting' ? (r.detail || 'waiting on you').replace(/^asks: /, '') : r.reason === 'over 250k' ? `${ktok(r.context)} context: clear it at the next stop` : r.reason === 'stale' ? 'No report for over 30 minutes' : r.reason === 'no session' ? 'Registered, but no session is reporting' : 'A worktree session the maestro did not start')
  list.replaceChildren(...rows.map(r => $('li', {}, $(r.link ? 'a' : 'div', r.link ? { class: 'item', href: r.link, 'data-focus': `open:${r.key}`, 'aria-label': `Open ${r.name}: ${reason(r)}` } : { class: 'item' },
    $('span', { title: r.reason }, shape(r.shape, r.reason)),
    $('span', {}, r.name),
    r.link ? $('span', { class: 'open', 'aria-hidden': 'true' }, 'Open') : $('span'),
    $('span', { class: 'why' }, reason(r)),
  ))))
}

function grid(snap) {
  const { from, to } = snap.window
  const pos = t => `${(100 * (Math.min(Math.max(t, from), to) - from)) / (to - from)}%`
  const width = (a, b) => `${Math.max(0.4, (100 * (Math.min(b, to) - Math.max(a, from))) / (to - from))}%`
  const short = to - from <= 2 * DAY
  const first = new Date(from)
  first.setMinutes(0, 0, 0)
  if (short) first.setHours(Math.ceil(first.getHours() / 3) * 3); else first.setHours(12)
  const days = []
  // Labels stay inside the track; midnight names the day; the now line is labelled.
  const inside = t => (t - from) / (to - from) > 0.04 && (to - t) / (to - from) > 0.04
  // Step in local time, so a DST change does not shift the labels.
  for (const d = new Date(first); +d <= to; d.setHours(d.getHours() + (short ? 3 : 24))) {
    const t = +d
    if (!inside(t)) continue
    const midnight = short && d.getHours() === 0
    days.push($('span', { style: `left:${pos(t)}`, class: midnight ? 'day' : '' }, midnight ? d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric' }) : short ? clock(t) : d.toLocaleDateString(undefined, { weekday: 'short' })))
  }
  days.push($('span', { class: 'nowlabel', style: `left:${pos(snap.builtAt)}` }, 'now'))
  const rows = [$('div', { class: 'row head' }, $('span'), $('span', {}, 'Workstream'), $('span', {}, 'Context'), $('span', {}, 'Stage'), $('span', {}, 'PR'), $('span', {}, 'Tasks, ETA'), $('div', { class: 'days' }, days))]
  const nowLine = () => [...snap.pauses.filter(p => p.to > from && p.from < to).map(p => $('span', { class: 'wait', style: `left:${pos(p.from)};width:${width(p.from, p.to)}`, title: waitLabel(p) })),
    $('span', { class: 'now', style: `left:${pos(snap.builtAt)}` })]
  document.getElementById('work-meta').textContent = `${new Date(from).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })} to ${new Date(to).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}`

  for (const r of snap.rows) {
    const segs = marks(r, pos, width)
    const isOpen = open.has(r.key)
    const toggle = () => { isOpen ? open.delete(r.key) : open.add(r.key); saveOpen(); render(snap) }
    const canOpen = r.tasks.length > 0
    const label = r.link ? $('a', { href: r.link, 'data-focus': `name:${r.key}`, onclick: e => e.stopPropagation() }, r.name) : $('span', {}, r.name)
    // The ETA cell is the disclosure button; a click anywhere else on the row does the same for the mouse.
    rows.push($('div', {
      class: `row${canOpen ? ' click' : ''}${isOpen ? ' open' : ''}`,
      ...(canOpen ? { onclick: e => { if (!e.target.closest('a, button')) toggle() } } : {}),
    },
      $('span', { title: r.reason }, shape(r.shape, r.reason)),
      $('span', { class: 'name' }, label, ['idle', 'running'].includes(r.reason) ? null : $('span', { class: 'why2' }, r.reason)),
      $('span', { class: r.context >= 250000 ? 'big' : '' }, ktok(r.context)),
      $('span', { class: 'meta' }, r.stage || (r.detail && r.detail !== 'no plan' ? r.detail : '')),
      $('span', { class: 'meta' }, r.pr || (r.plan ? 'none' : '')),
      r.total
        ? $('button', { class: 'disclose', 'data-focus': `eta:${r.key}`, 'aria-expanded': String(isOpen), 'aria-label': `${r.name}: ${r.done} of ${r.total} tasks done, ${dur(r.eta)} left. ${isOpen ? 'Hide' : 'Show'} tasks`, onclick: toggle },
          `${r.done} of ${r.total} · ${dur(r.eta)}${r.etaCalibrated ? '' : ' ?'}`)
        : $('span', { class: 'meta' }, r.plan === null && r.workstream ? 'no plan' : ''),
      $('div', { class: 'track' }, nowLine(), segs),
    ))
    if (isOpen) {
      rows.push($('div', { class: 'tasks' },
        r.tasks.map(t => $('div', { class: 'task' },
          $('svg:svg', { width: 10, height: 10, viewBox: '0 0 10 10', role: 'img', 'aria-label': t.done ? 'done' : t.current ? 'current' : 'to do' },
            $('svg:circle', { cx: 5, cy: 5, r: 4, fill: t.done ? 'var(--data)' : 'none', stroke: t.done || t.current ? 'var(--data)' : 'var(--border)', 'stroke-width': 1.5 })),
          $('span', {}, `${t.n}. ${t.title}`),
          $('span', { class: 'meta' }, [t.agent, t.risk].filter(Boolean).join(' · ')),
          $('span', {}, t.done ? dur(t.minutes) : `est ${dur(t.minutes)}${t.calibrated ? '' : ' ?'}`),
        ))))
    }
  }
  for (const q of snap.queued) {
    rows.push($('div', { class: 'row' }, $('span'), $('span', { class: 'meta' }, `Next: ${q.name}`), $('span'), $('span', { class: 'meta' }, 'queued'), $('span'),
      $('span', { class: 'meta' }, `${dur(Math.round((q.end - q.start - waitMs(snap, q.start, q.end)) / MIN))}${q.calibrated ? '' : ' ?'}`),
      $('div', { class: 'track' }, nowLine(), $('span', { class: 'pill', style: `left:${pos(q.start)};width:${width(q.start, q.end)};border:1px dashed var(--muted);box-sizing:border-box` }))))
  }
  const diamonds = [
    ...snap.rollout.merges.map(m => ({ at: m.at, filled: true, label: `Merged: ${m.subject}` })),
    ...snap.rollout.releases.map(m => ({ at: m.at, filled: true, label: `Released: ${m.subject}` })),
    ...snap.rollout.projected.map(m => ({ at: m.at, filled: false, label: `${m.name}, projected merge` })),
  ]
  rows.push($('div', { class: 'row' }, $('span'), $('span', { class: 'meta' }, 'Rollout'), $('span'), $('span'), $('span'), $('span'),
    $('div', { class: 'track' }, nowLine(), diamonds.map(m => $('span', { style: `position:absolute;left:${pos(m.at)};top:4px;margin-left:-6px`, title: `${m.label}, ${when(m.at)}` },
      $('svg:svg', { width: 12, height: 12, 'aria-label': `${m.label}, ${when(m.at)}`, role: 'img' },
        $('svg:polygon', { points: '6,0.5 11.5,6 6,11.5 0.5,6', fill: m.filled ? 'var(--text)' : 'var(--surface)', stroke: 'var(--text)' })))))))
  document.getElementById('grid').replaceChildren(...rows)
  const key = (s, text) => $('span', {}, $('span', { style: 'display:inline-block;vertical-align:-2px;margin-right:6px' }, shape(s, '')), text)
  document.getElementById('legend').replaceChildren(
    key('triangle', 'Waiting on you'), key('square', '250k context or more'), key('circle', 'Running'), key('half', 'Idle'), key('half-open', 'Stale or unregistered'),
    $('span', {}, $('span', { class: 'sw', style: 'background:var(--data)' }), 'Done'),
    $('span', {}, $('span', { class: 'sw', style: 'background:var(--data-tint)' }), 'Estimated'),
    $('span', {}, $('span', { class: 'sw', style: 'border:1px dashed var(--muted);border-radius:5px' }), 'Queued'),
    $('span', {}, $('span', { class: 'sw wait-sw' }), 'Waiting for a limit reset'),
    $('span', {}, '◆ Merged or released · ◇ Projected merge'),
    $('span', {}, '? Uncalibrated estimate'),
  )
}

// One rounded pill per workstream: the planned span as a tint, the done part solid.
function marks(r, pos, width) {
  const done = r.tasks.filter(t => t.done && t.start != null && t.end != null)
  const all = r.tasks.filter(t => t.start != null && t.end != null)
  if (!all.length) return []
  const start = Math.min(...all.map(t => t.start)), end = Math.max(...all.map(t => t.end))
  const doneEnd = done.length ? Math.max(...done.map(t => t.end)) : null
  const title = `${r.done} of ${r.total} done, ${dur(r.eta)} left`
  return [
    $('span', { class: 'pill', style: `left:${pos(start)};width:${width(start, end)};background:var(--data-tint)`, title }),
    doneEnd ? $('span', { class: 'pill', style: `left:${pos(start)};width:${width(start, doneEnd)};background:var(--data)`, title }) : null,
  ]
}

// The delivery calendar: a month grid of projected merges by day, after the limit waits.
const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return +d }
const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return +d }
const dropMark = q => $('svg:svg', { width: 12, height: 12, role: 'img', 'aria-label': q ? 'queued, projected merge' : 'projected merge' },
  $('svg:polygon', { points: '6,0.5 11.5,6 6,11.5 0.5,6', fill: 'var(--surface)', stroke: q ? 'var(--muted)' : 'var(--text)', 'stroke-dasharray': q ? '2 2' : null }))

function calendar(snap) {
  const drops = [...snap.rows.filter(r => r.end != null).map(r => ({ name: r.name, at: r.end, queued: false })), ...snap.queued.map(q => ({ name: q.name, at: q.end, queued: true }))].sort((a, b) => a.at - b.at)
  const box = document.getElementById('cal')
  const waits = waitMs(snap, snap.builtAt, Infinity)
  document.getElementById('cal-meta').textContent = drops.length ? `At today's pace${waits ? `, with ${dur(Math.round(waits / MIN))} of limit waits` : ''}` : ''
  if (!drops.length) { box.replaceChildren($('p', { class: 'meta', style: 'margin:0' }, 'No plan is open, so nothing is due.')); return }
  const today = dayStart(snap.builtAt), lastDay = dayStart(drops.at(-1).at)
  const on = d => drops.filter(x => x.at >= d && x.at < addDays(d, 1))
  const drop = x => $('div', { class: 'drop' }, dropMark(x.queued), $('b', {}, x.name), $('span', { class: 'meta' }, clock(x.at)))
  const first = addDays(today, -((new Date(today).getDay() + 6) % 7))
  const end = addDays(lastDay, 7 - ((new Date(lastDay).getDay() + 6) % 7))
  const cells = []
  for (let i = 0; i < 7; i++) cells.push($('div', { class: 'dow' }, new Date(addDays(first, i)).toLocaleDateString(undefined, { weekday: 'short' })))
  for (let d = first; d < end; d = addDays(d, 1)) {
    const its = on(d), from = Math.max(d, snap.builtAt), wait = waitMs(snap, from, addDays(d, 1))
    const blocked = wait > 0 && wait >= addDays(d, 1) - from - MIN
    const dt = new Date(d)
    cells.push($('div', { class: `cell${d < today ? ' past' : ''}${d === today ? ' today' : ''}${blocked ? ' blocked' : ''}${!its.length && !wait ? ' empty' : ''}` },
      $('span', { class: 'num', 'aria-label': dt.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }) },
        dt.getDate() === 1 || d === first ? dt.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : String(dt.getDate())),
      its.map(drop),
      wait ? $('span', { class: 'note' }, blocked ? 'Limit spent: no work' : `${dur(Math.round(wait / MIN))} limit wait`) : null))
  }
  box.replaceChildren($('div', { class: 'month' }, cells))
}

// Redraws replace the DOM every 5 seconds; keep keyboard focus on the same control.
function render(snap) {
  const focused = document.activeElement?.dataset?.focus
  draw(snap)
  if (focused) document.querySelector(`[data-focus="${CSS.escape(focused)}"]`)?.focus()
}

function draw(snap) {
  if (snap.error) {
    document.getElementById('finding').replaceChildren($('span', { class: 'error' }, `The snapshot failed: ${snap.error}`))
    fail(`The snapshot failed: ${snap.error}`)
    return
  }
  title(snap)
  kpis(snap)
  chart(snap)
  needs(snap)
  grid(snap)
  calendar(snap)
  if (snap.staleSince) fail(`The data is stale since ${clock(snap.staleSince)}: the last rebuild failed.`)
  else if (failed) { failed = false; say('Live again.') }
}

let last = null
async function poll() {
  try {
    const r = await fetch('/api/snapshot', { cache: 'no-store' })
    if (!r.ok) throw new Error(`HTTP ${r.status}`)
    last = await r.json()
  } catch {
    const msg = 'The liveview server stopped. Start it again with /orchestra:liveview.'
    document.getElementById('fresh').replaceChildren($('span', { class: 'error' }, msg))
    fail(msg)
    return
  }
  try {
    if (last) render(last)
  } catch (err) {
    console.error(err)
    const msg = `This page failed to draw the snapshot: ${err.message}`
    document.getElementById('fresh').replaceChildren($('span', { class: 'error' }, msg))
    fail(msg)
  }
}
applyTheme(theme)
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => last && render(last))
poll()
setInterval(poll, 5000)
addEventListener('resize', () => last && render(last))
</script>
</body>
</html>
